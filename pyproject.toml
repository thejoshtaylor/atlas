[project]
name = "spire-voice"
version = "0.1.0"
description = "A self-hosted voice assistant for the home."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    "openai>=3.14,<4",
    "websockets>=17.1,<18",
    "httpx>=0.28,<0.29",
    "mcp>=2.2,<3",
    "aiortc>=1.15,<2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "mcp"]
