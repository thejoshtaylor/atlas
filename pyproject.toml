[project]
name = "spire-voice"
version = "0.1.0"
description = "A self-hosted voice assistant for the home."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    # Pinned below Phase 01's original >=3.14 floor: every openai release from
    # 3.3.1 onward requires jiter>=0.16.0, and every instructor release (up to
    # and including the 1.17.0 this phase installs) requires jiter<0.15 --
    # verified against PyPI's per-version metadata for both packages, this
    # session. 3.0.0-3.3.0 is the newest contiguous range where both
    # constraints hold at once; see 01.1-01-SUMMARY.md for the version survey.
    "openai>=3.0,<3.3.1",
    "instructor>=1.17,<2",
    "websockets>=17.1,<18",
    "httpx>=0.28,<0.29",
    "mcp>=2.2,<3",
    "aiortc>=1.15,<2",
    "pyyaml",
    # Human-approved 2026-09-17 after RESEARCH.md's Package Legitimacy Audit
    # returned [SUS] for all four (unknown-downloads/too-new/no-repository
    # metadata gaps, not a content red flag) -- operator confirmed each
    # PyPI project page and its source repository before this install ran
    # (02-01-PLAN.md Task 1, gate="blocking-human", never auto-approved).
    "openwakeword==0.6.0",
    "vosk==0.3.44",
    "onnxruntime>=1.30,<2",
    # No version pin: this phase computes buffer/energy math against it
    # directly rather than only inheriting it transitively through av/
    # onnxruntime. Left unpinned deliberately -- see 02-01-SUMMARY.md for
    # the resolved version, recorded the way 01.1-01-SUMMARY.md recorded
    # jiter's cross-package pin conflict.
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "mcp"]
