[project]
name = "atlas"
version = "0.1.0"
description = "A self-hosted voice assistant for the home."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    # Pinned below Phase 01's original >=3.14 floor: every openai release from
    # 3.3.1 onward requires jiter>=0.16.0, and every instructor release (up to
    # and including the 1.17.0 this phase installs) requires jiter<0.15 --
    # verified against PyPI's per-version metadata for both packages, this
    # session. 3.0.0-3.3.0 is the newest contiguous range where both
    # constraints hold at once; see 01.1-01-SUMMARY.md for the version survey.
    "openai>=3.0,<3.3.1",
    "instructor>=1.17,<2",
    "websockets>=17.1,<18",
    "httpx>=0.28,<0.29",
    "mcp>=2.2,<3",
    "aiortc>=1.15,<2",
    "pyyaml",
    # Human-approved 2026-09-17 after RESEARCH.md's Package Legitimacy Audit
    # returned [SUS] for all four (unknown-downloads/too-new/no-repository
    # metadata gaps, not a content red flag) -- operator confirmed each
    # PyPI project page and its source repository before this install ran
    # (02-01-PLAN.md Task 1, gate="blocking-human", never auto-approved).
    "openwakeword==0.6.0",
    "vosk==0.3.44",
    "onnxruntime>=1.30,<2",
    # No version pin: this phase computes buffer/energy math against it
    # directly rather than only inheriting it transitively through av/
    # onnxruntime. Left unpinned deliberately -- see 02-01-SUMMARY.md for
    # the resolved version, recorded the way 01.1-01-SUMMARY.md recorded
    # jiter's cross-package pin conflict.
    "numpy",
    # Human-approved 2026-09-17 after RESEARCH.md's Package Legitimacy Audit
    # returned [SUS] for most of these seven (unknown-downloads/too-new/
    # no-repository metadata gaps, not a content red flag) -- operator
    # confirmed each PyPI project page and its source repository before this
    # install ran (03-01-PLAN.md Task 1, gate="blocking-human", never
    # auto-approved). Versions re-verified against `pip index versions` this
    # session (2026-09-17); all seven matched RESEARCH.md exactly, no drift.
    # PyJWT and cryptography were already present transitively (via mcp) and
    # are promoted to direct pins here so the PyJWT>=2.13 floor -- five
    # advisories including CVE-2026-48526, where a public JWK could be
    # accepted as an HMAC secret -- is enforced by this file rather than held
    # accidentally by whatever the mcp SDK happens to require.
    # [asyncio] extra pulls in greenlet, which create_async_engine requires
    # to bridge SQLAlchemy's synchronous core into async code -- not an
    # independent package choice, but the documented shape of installing
    # SQLAlchemy's async engine at all. 03-01 pinned sqlalchemy without this
    # extra, which is a defect corrected here (03-02): the async engine
    # 03-01 was approved to provide could not actually connect without it.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "psycopg[binary]>=3.3,<4",
    "alembic>=1.20,<2",
    "PyJWT>=2.13,<3",
    "pwdlib[argon2]>=0.3,<0.4",
    "cryptography>=50,<51",
    # Human-approved 2026-09-19 after 07-RESEARCH.md's Package Legitimacy Audit
    # returned [SUS] (unknown-downloads metadata gap, not a content red flag) --
    # operator confirmed the PyPI project page and github.com/SYSTRAN/faster-whisper
    # before this install ran (07-03-PLAN.md Task 1, gate="blocking-human", never
    # auto-approved). D-09 names this unconditionally -- it is a default
    # dependency, not an extra.
    "faster-whisper>=1.2,<2",
    # Human-approved 2026-09-21 after RESEARCH.md's Package Legitimacy Audit --
    # operator confirmed pypi.org/project/pytapo and github.com/JurajNyiri/pytapo
    # agree (VOICE-05 quick task, gate="blocking-human", never auto-approved).
    # This is the client Home Assistant's own Tapo Control integration depends
    # on, and the only one implementing the encrypt_type=3 / SHA256 8800
    # media-session auth this camera's firmware now requires -- go2rtc's
    # built-in tapo:// client cannot satisfy it.
    "pytapo>=3.4,<4",
    # Human-approved 2026-09-24 (09-02-PLAN.md Task 1, gate="blocking-human",
    # never auto-approved). 09-RESEARCH.md recommended `talon`, but the only
    # `talon` on PyPI is 1.4.4, a 2017-08-24 source-only build pulling
    # cchardet/scipy/scikit-learn -- not a safe bet on this project's Python
    # 3.14. The replacement ships a py3-none-any wheel, no runtime
    # dependencies, MIT licensed, active releases through 2025-12-01.
    "mail-parser-reply>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
# Human-approved 2026-09-19 after 07-RESEARCH.md's Package Legitimacy Audit
# returned [SUS] (too-new + unknown-downloads metadata gaps, not a content red
# flag) -- operator confirmed the PyPI project page and its source repository,
# github.com/OHF-Voice/piper1-gpl, before this install ran (07-03-PLAN.md
# Task 1, gate="blocking-human", never auto-approved). Distribution name is
# `piper-tts`; the repository is named `piper1-gpl` but that name does not
# resolve as an installable distribution. D-10: GPL-3.0-or-later licence,
# optional per D-10 -- never a default dependency.
piper = ["piper-tts>=1.8,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "edge/src" (Phase 10, plan 10-02): lets the server suite import
# `atlas_edge` directly and drive the real Pi client against the real
# application, the same way "mcp" already lets it drive the real MCP
# child modules.
pythonpath = ["src", "mcp", "edge/src"]
markers = [
    "integration: needs a reachable Postgres",
]
