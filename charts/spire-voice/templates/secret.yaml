apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spire-voice.secretName" . }}
  labels:
    {{- include "spire-voice.labels" . | nindent 4 }}
type: Opaque
data:
  # Every ${VAR} config/config.example.yaml names (D-15) -- the loader
  # raises by name on an absent variable, so every one of these keys must
  # exist here even when the operator has not supplied a value (empty,
  # never missing).
  BIND_HOST: {{ .Values.config.bindHost | b64enc }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | b64enc }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://spire:changeme@%s:5432/spire" (include "spire-voice.postgres.fullname" .) | b64enc }}
  TAPO_USER: {{ .Values.env.tapoUser | default "" | b64enc }}
  TAPO_PASSWORD: {{ .Values.env.tapoPassword | default "" | b64enc }}
  SPEAKER_ENSURE_URL: {{ .Values.env.speakerEnsureUrl | default "" | b64enc }}
  XAI_API_KEY: {{ .Values.env.xaiApiKey | default "" | b64enc }}
