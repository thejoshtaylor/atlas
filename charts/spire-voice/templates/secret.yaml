{{/*
260922-cmo (D-2): the whole document is guarded on .Values.secretName
being empty. A non-empty secretName names a Secret the operator applies
by hand -- every house-specific credential and value enters there,
never through this templated one, and this chart must render no Secret
of its own in that case (T-CMO-03). Left empty, everything below renders
exactly as it did before this plan.
*/}}
{{- if not .Values.secretName }}
{{/*
D-16: the guard. `lookup` reads this release's own Secret, by name, before
this template decides anything. Found -> both generated values (the
application's secret key and the bundled database's password) are carried
forward byte-for-byte, unchanged. Not found -> both are generated fresh.
This is the entire mechanism behind "an upgrade never regenerates the
key" (T-07-37): the key derives both the JWT signing key and the
credential-encryption key (auth/tokens.py), so a new one on a second boot
would invalidate every stored credential and every issued session at
once, silently.

On `helm template`/`--dry-run`, `lookup` always returns an empty map --
Helm's own documented behavior when there is no live cluster to query --
so a dry-run render always shows a freshly generated value, even against
a release that already exists. That is expected, not a bug: it is why
this plan's actual proof (scripts/verify-helm-deploy.sh) runs a real
install and a real upgrade against a live cluster, rather than trusting a
rendered diff.
*/}}
{{- $secretName := include "spire-voice.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $existingSecretKey := "" }}
{{- $existingPostgresPasswordB64 := "" }}
{{- if $existing }}
{{- $existingSecretKey = index $existing.data "SPIRE_SECRET_KEY" | default "" }}
{{- $existingPostgresPasswordB64 = index $existing.data "POSTGRES_PASSWORD" | default "" }}
{{- end }}

{{/*
SPIRE_SECRET_KEY: 32 random bytes, base64-encoded -- the shape
auth/tokens.py's validate_secret_key_strength requires (exactly 32
decoded bytes, real byte variety), and the same shape
cryptography.fernet.Fernet.generate_key() produces. `randBytes` returns
Sprig's own base64.StdEncoding-flavored string; validate_secret_key_
strength decodes with base64.urlsafe_b64decode, which only remaps two
characters before delegating to the standard decoder -- a standard-
alphabet input decodes identically (checked directly against the real
validator this plan's own chart tests). Never the alphanumeric-only
generator: an alphanumeric string's decoded length is not its character
count, and it would not reliably produce 32 raw bytes at all.
*/}}
{{- $secretKeyField := $existingSecretKey }}
{{- if not $secretKeyField }}
{{- $secretKeyField = randBytes 32 | toString | b64enc }}
{{- end }}

{{/*
The bundled database's own password -- generated under the identical
guard, so no default password for it ships in this repository at all.
Letters only (`randAlpha`): DATABASE_URL embeds this value directly in a
connection string's userinfo component, and a generated digit is no
safer than a generated letter here, while a generated `+`, `/`, or `=` (a
real risk with a base64-flavored generator) would corrupt the URL
outright.
*/}}
{{- $plainPostgresPassword := "" }}
{{- if $existingPostgresPasswordB64 }}
{{- $plainPostgresPassword = $existingPostgresPasswordB64 | b64dec }}
{{- else }}
{{- $plainPostgresPassword = randAlpha 32 }}
{{- end }}

{{/*
Composed from the release's own headless Postgres Service name and the
password just resolved above -- an operator supplies nothing for this
value at all.
*/}}
{{- $databaseUrl := printf "postgresql+asyncpg://spire:%s@%s:5432/spire" $plainPostgresPassword (include "spire-voice.postgres.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    # WR-01 (code review). The `lookup` guard above protects an upgrade.
    # It did nothing for uninstall-then-reinstall, and that path destroyed
    # a deployment in silence: `helm uninstall` deleted this Secret, while
    # Kubernetes NEVER deletes a StatefulSet's volumeClaimTemplates PVC,
    # so the initialized database survived with the old password. A
    # reinstall then generated a new POSTGRES_PASSWORD (which the
    # surviving database rejects, since the image reads that variable only
    # at initdb time) and, in the same moment, a new SPIRE_SECRET_KEY --
    # making every credential row still sitting in that surviving database
    # permanently undecryptable. Two documented commands, run in order, by
    # an operator doing nothing unusual.
    #
    # `keep` means this Secret outlives the release, so the reinstall's
    # `lookup` finds it and carries both values forward, exactly as an
    # upgrade does. The two things that must be deleted together -- this
    # Secret and the `postgres-data-*` PVC -- are then both deliberate
    # operator actions rather than one of them being a side effect of the
    # other. docs/runbooks/deploy-helm.md states that pairing, because
    # Helm cannot enforce it: `helm uninstall` has no way to keep a PVC
    # and a Secret in step.
    #
    # A reinstall under the SAME release name and namespace adopts this
    # Secret (its Helm ownership annotations still match). A reinstall
    # under a DIFFERENT name fails loudly on ownership metadata -- and a
    # different release name means a different StatefulSet, so a different
    # PVC too, which is a genuinely fresh deployment rather than the
    # mismatch this annotation exists to prevent.
    helm.sh/resource-policy: keep
  labels:
    {{- include "spire-voice.labels" . | nindent 4 }}
type: Opaque
data:
  # Every ${VAR} config/config.example.yaml names (D-15) -- the loader
  # raises by name on an absent variable, so every one of these keys must
  # exist here even when the operator has not supplied a value (empty,
  # never missing).
  #
  # WR-02 (code review): every value below is piped through `toString`
  # before `b64enc`, which only accepts a string. Helm's `--set` infers a
  # type from the text an operator types, so `--set
  # config.cookieSecure=false` produced a real bool and `--set
  # env.xaiApiKey=12345` a real int, and the render failed outright with
  # "wrong type for value; expected string; got bool". That mattered
  # because `--set config.cookieSecure=false` is the remedy values.yaml
  # itself tells a non-TLS operator to use. Coercing here fixes the
  # contract for every key at once, rather than documenting
  # `--set-string` and relying on an operator having read it.
  BIND_HOST: {{ .Values.config.bindHost | toString | b64enc }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | toString | b64enc }}
  DATABASE_URL: {{ $databaseUrl | toString | b64enc }}
  TAPO_USER: {{ .Values.env.tapoUser | default "" | toString | b64enc }}
  TAPO_PASSWORD: {{ .Values.env.tapoPassword | default "" | toString | b64enc }}
  SPEAKER_ENSURE_URL: {{ .Values.env.speakerEnsureUrl | default "" | toString | b64enc }}
  # Only read by speaker/tapo_talk.py, and only when speaker.backend is set
  # to tapo_talk (config/config.example.yaml) -- unused, and safe to leave
  # blank, on the default go2rtc path.
  TAPO_CLOUD_PASSWORD: {{ .Values.env.tapoCloudPassword | default "" | toString | b64enc }}
  XAI_API_KEY: {{ .Values.env.xaiApiKey | default "" | toString | b64enc }}
  # 260922-cmo (D-1, T-CMO-02): the whole authenticated camera URL and the
  # speaker backend choice, moved behind ${VAR}s so no camera IP or house
  # data lives in this public repo's config.example.yaml. Real values are
  # only ever set on the hand-applied Secret this chart's secretName can
  # point at instead -- these two keys exist here purely so the templated
  # path (secretName unset) still renders a complete Secret.
  CAMERA_RTSP_URL: {{ .Values.env.cameraRtspUrl | default "" | toString | b64enc }}
  SPEAKER_BACKEND: {{ .Values.env.speakerBackend | default "go2rtc" | toString | b64enc }}
  # 260922-fmi (D-15, D-20): safe default false. The real value only ever
  # arrives on the hand-applied Secret (D-2) -- the operator turns the
  # calibration echo-path route on there, never in this templated one.
  CALIBRATION_ROUTE_ENABLED: {{ .Values.env.calibrationRouteEnabled | default "false" | toString | b64enc }}
  # Not a config.yaml placeholder (read directly from the environment by
  # auth/tokens.py's read_secret_key, never through config.py's ${VAR}
  # expansion) -- carried here regardless, since the application cannot
  # boot without it.
  SPIRE_SECRET_KEY: {{ $secretKeyField }}
  # Internal to this chart: consumed by the bundled Postgres StatefulSet's
  # own POSTGRES_PASSWORD env var and by DATABASE_URL above, never read by
  # the application directly.
  POSTGRES_PASSWORD: {{ $plainPostgresPassword | toString | b64enc }}
{{- end }}
