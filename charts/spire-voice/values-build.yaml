# jt-spire build cluster values, read by the Argo CD Application through
# `helm.valueFiles` (config/argo/spire-voice-application.yaml). No
# credential lives here — every ${VAR} config/config.example.yaml names
# still arrives through the runtime Secret named by `secretName` (D-2),
# applied by hand on this cluster.

# argocd-image-updater appends `@sha256:...` to this exact value on every
# push, so the running tag stays digest-pinned even though the tag reads
# `latest`.
image:
  ref: harbor.tail41bc66.ts.net/spire-voice/app:latest

secretName: spire-voice

# The public ingress: `voice.jtlabs.co` already resolves (the wildcard
# `*.jtlabs.co` record is Cloudflare-proxied) straight to this cluster.
# Cloudflare terminates public TLS in "Full" mode (not "Full strict"), so
# the origin hop lands on k3s Traefik's `websecure` entrypoint and is
# validated only as far as "some cert is presented" — Traefik's own
# default cert is enough, and no per-host cert Secret is needed here. This
# is the same public-hop model chat-manager already runs on this cluster.
ingress:
  enabled: true
  className: traefik
  host: voice.jtlabs.co
  tls: []
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

# The ingress above puts this webapp on public HTTPS, so the session
# cookie must be Secure. `config.cookieSecure` here is inert: `secretName`
# is set above, so the chart renders no templated Secret at all (see
# tests/test_helm_chart.py::test_a_hand_applied_secret_name_renders_no_templated_secret)
# — the value that actually reaches the running pod is COOKIE_SECURE in
# the hand-applied `home/spire-voice` Secret, which must be "true" now
# that this ingress is public. See
# docs/runbooks/deploy-build-cluster.md for that coupling and the
# pod-restart it needs to take effect.
# CALIBRATION_ROUTE_ENABLED (260922-fmi, D-15, D-20) is not set here for
# the same reason COOKIE_SECURE above is not: `secretName` above means
# this chart renders no templated Secret at all, so the value that
# actually reaches the running pod lives in the hand-applied
# `home/spire-voice` Secret (D-2), not in this file.
config:
  bindHost: "0.0.0.0"
  cookieSecure: "false"

persistence:
  data:
    size: 5Gi
    # Unset: uses the cluster's default StorageClass. An operator who
    # wants a specific class (for example, to avoid the root-disk IO
    # incident this cluster's other projects have hit) sets it here.
  models:
    size: 15Gi

postgres:
  persistence:
    size: 10Gi
