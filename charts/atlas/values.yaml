# Default values for the atlas chart.
#
# D-15: this chart's whole job is to deliver the project's own
# config/config.example.yaml (shipped verbatim in files/config.yaml,
# placeholders intact) and the variables it names -- nothing here
# re-templates the configuration's contents. A value below either fills
# one of those ${VAR} placeholders (through the generated Secret) or
# configures the Kubernetes objects around the application (image,
# service, ingress, volume sizes).

image:
  # No default registry is baked in on purpose: a stranger following the
  # README pushes their own build (or points this at a registry they can
  # reach) rather than pulling an image this project would have to
  # maintain and version independently of the chart.
  repository: atlas
  tag: latest
  pullPolicy: IfNotPresent
  # 260922-cmo: set by argocd-image-updater (never by hand) once the
  # deploy-on-main-push pipeline is live -- a digest-pinned reference that
  # overrides repository/tag entirely when non-empty. Left empty, the
  # chart falls back to the repository:tag pair above, exactly as before.
  ref: ""

# 260922-cmo (D-2): set this to the name of a Secret the operator applies
# by hand to switch the chart onto that Secret instead of the templated
# one this chart generates -- see charts/atlas/templates/secret.yaml
# and docs/runbooks/deploy-build-cluster.md. Left empty, nothing changes.
secretName: ""

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  # Off by default -- an operator turns this on rather than editing a
  # template, matching the chart-authoring instruction this plan was
  # given.
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

persistence:
  # The two mount points config.example.yaml already names: the data root
  # (sessions, the TTS cache, calibration) and the model root (the local
  # provider set, the wake-word model). Both PersistentVolumeClaims --
  # never emptyDir -- so an upgrade or a rescheduled pod keeps what is on
  # them.
  data:
    size: 5Gi
    storageClassName: ""
  models:
    size: 10Gi
    storageClassName: ""

resources: {}

config:
  # This deployment's own values for the two variables plan 07-05 made
  # environment-supplied (config.example.yaml's bind_host/cookie_secure).
  #
  # bind_host: the pod is reached through a Service, never directly --
  # binding to loopback here would make the application unreachable from
  # its own Service. This must stay "0.0.0.0" for the chart to work at
  # all.
  bindHost: "0.0.0.0"
  # cookie_secure: true, because this chart assumes an Ingress (or some
  # other front door) terminates TLS before traffic reaches the Service --
  # the standard shape for a Kubernetes-fronted deployment. An operator
  # who is NOT terminating TLS in front of this release must set this to
  # "false" explicitly; doing so brings back the insecure-cookie/
  # reachable-bind warning plan 07-07 added at startup (IN-01), which is
  # the backstop for exactly this case.
  #
  # WR-02 (code review): `--set config.cookieSecure=false` works, and so
  # does `--set-string config.cookieSecure=false`. It did not always:
  # `--set` infers an unquoted `false` as a real boolean, and the Secret
  # template's `b64enc` only accepts a string, so the documented remedy
  # made the render fail. Every value the Secret template encodes is
  # coerced with `toString` there now, so neither form of --set can
  # produce a type error. The application still requires the expanded
  # value to read back as exactly `true` or `false` and refuses anything
  # else by name (`SecurityConfig.from_config`).
  cookieSecure: "true"

# Provider credentials and camera settings, each an env var
# config/config.example.yaml's ${VAR} placeholders name. Left blank by
# default (the credential-missing/degraded-slot posture D-04 already
# defines) -- an operator sets what they use in their own values file or
# via --set, never by editing the chart's templates.
env:
  xaiApiKey: ""
  tapoUser: ""
  tapoPassword: ""
  speakerEnsureUrl: ""
  # Only used when speaker.backend is set to tapo_talk
  # (config/config.example.yaml) -- blank is safe on the default go2rtc path.
  tapoCloudPassword: ""
  # 260922-cmo (D-1, T-CMO-02): the whole authenticated camera URL --
  # config.example.yaml no longer bakes in a host or credentials, so this
  # must be set (via a values file or the hand-applied Secret named by
  # secretName) for the camera source to work.
  cameraRtspUrl: ""
  # go2rtc | tapo_talk | tcp -- see config/config.example.yaml's own comment.
  speakerBackend: go2rtc
  # Only used when speakerBackend is tcp: the tcp://host:port of the
  # listener that plays reply audio. Blank is safe on every other backend.
  speakerTcpUrl: ""
  # 260923-pyj: the reply audio format. alaw and 8000 for go2rtc and
  # tapo_talk, which is all the camera plays; pcm and 24000 sound better
  # on tcp.
  ttsCodec: alaw
  ttsSampleRate: "8000"
  # 260922-fmi (D-15, D-20): public safe default. The house turns the
  # calibration echo-path route on by setting this true in its own
  # hand-applied Secret (D-2), never in this chart.
  calibrationRouteEnabled: "false"

postgres:
  # D-14: always bundled, plain manifests against the official image --
  # never a subchart, and never the vendor image line 07-RESEARCH.md's
  # Pitfall 5 found unmaintained as a free image since 2025-08-28.
  image: postgres:18
  persistence:
    size: 10Gi
    storageClassName: ""
