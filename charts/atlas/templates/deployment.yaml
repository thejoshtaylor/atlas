apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas.fullname" . }}
  labels:
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate: the camera allows one talk session, and an
  # old and a new pod that both connect to it trigger its auth lockout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "atlas.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas.selectorLabels" . | nindent 8 }}
    spec:
      # No privileged container and no host mount anywhere in this chart
      # (T-07-43) -- runAsNonRoot enforces the image's own non-root `atlas`
      # user without this chart needing to know its numeric uid.
      #
      # CR-01 (code review): this pod-level context applies to EVERY
      # container in the pod, init containers included -- so it cannot be
      # written as though it only describes the application image. The
      # init container below runs the official `postgres` image, which
      # declares no USER at all (it starts as root and drops to `postgres`
      # with gosu inside its own entrypoint), so inheriting a bare
      # `runAsNonRoot: true` made the kubelet refuse it before it ever ran
      # ("container has runAsNonRoot and image will run as root") and the
      # whole chart could not install on any cluster. Every container that
      # does not declare a non-root USER in its own image therefore carries
      # its own securityContext naming the uid to run as.
      #
      # WR-07 (code review): `fsGroup` is what makes the two mounted
      # PersistentVolumeClaims writable by that non-root user. Without it,
      # ownership of a volume root is whatever the CSI driver creates --
      # root-owned 0755 on many drivers, this cluster's Longhorn included
      # -- and the application could not create the session, TTS-cache or
      # calibration directories under /data, nor could the model fetch
      # script write into /models. 07-08-PLAN.md's T-07-43 mitigation
      # asserted "the same ownership on the mounted volumes"; nothing in
      # the chart established it. The gid is the one the Dockerfile pins
      # for its `atlas` group, so the chart and the image cannot drift.
      # `OnRootMismatch` means the recursive chown runs only when the
      # volume root's group is wrong -- not on every pod start, which on a
      # full models volume would be a real delay for no change.
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      # 260923-spd: explicit, matching Kubernetes' own default -- named
      # here rather than left implicit so the number is visible next to
      # the reason it matters. `lifespan`'s shutdown now stops the speaker
      # supervisor (the camera's talk session) FIRST and bounds that call
      # at 5s, specifically so it cannot eat this whole budget the way the
      # old, last-in-line ordering did -- a live pod restart once spent so
      # long on source-runner teardown and RTSP close before ever reaching
      # the speaker that this grace period expired, the pod was SIGKILLed,
      # and the camera held a stale talk session (401 on port 8800) until
      # a power cycle. No `preStop` hook: the reordering above is what
      # actually fixes the race, and a fixed `sleep` here would only add
      # latency to every restart without addressing it.
      terminationGracePeriodSeconds: 30
      initContainers:
        # Waits for the bundled database rather than restarting the whole
        # pod until it happens to be up -- a StatefulSet's own pod can take
        # a real moment on first install (a fresh PVC, an initdb run).
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            # The `postgres` user the official image itself creates and
            # runs its own server as -- uid/gid 999, confirmed directly
            # against `postgres:18` (`id postgres` -> `uid=999(postgres)
            # gid=999(postgres)`). Named here rather than left to the pod's
            # own `runAsNonRoot`, because that setting can only refuse an
            # image that declares no user; it cannot choose one. Nothing in
            # this container touches the database's files -- it only runs
            # `pg_isready` over the network -- so any non-root uid would
            # do; this one is the image's own, which keeps the binary's
            # runtime environment exactly what its packager intended.
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "atlas.postgres.fullname" . }} -p 5432 -U atlas; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: atlas
          # 260922-cmo: .Values.image.ref, when set, is the exact string
          # argocd-image-updater writes (a digest-pinned reference) --
          # falls back to the repository:tag pair for a plain
          # `helm install`/dev deploy that never runs image-updater at
          # all.
          image: {{ .Values.image.ref | default (printf "%s:%s" .Values.image.repository .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            # T-CMO-06: the kubelet refuses runAsNonRoot on a container
            # whose image declares its USER by name, not by number
            # (`atlas`, not a numeric uid) -- this is the
            # CreateContainerConfigError that stopped the built image
            # from ever running. 1001 is the exact uid/gid the Dockerfile
            # pins for that user (`groupadd --gid 1001` /
            # `useradd --uid 1001 --gid 1001`), so this cannot drift from
            # the image it names.
            runAsUser: 1001
            runAsGroup: 1001
          command: ["python", "-m", "atlas.app"]
          envFrom:
            # D-15: every variable config/config.example.yaml names arrives
            # through this one Secret -- Compose supplies the same names
            # from `.env` instead. Two sources, one loader.
            - secretRef:
                name: {{ include "atlas.secretName" . }}
          env:
            - name: ATLAS_CONFIG
              value: /etc/atlas/config.yaml
            - name: ATLAS_DATA_DIR
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            # The exact mount points config/config.example.yaml already
            # names (/data for sessions/tts-cache/calibration, /models for
            # the local provider set and the wake model) -- this chart does
            # not template the configuration's contents, so the paths here
            # must match the ones already baked into files/config.yaml.
            - name: config
              mountPath: /etc/atlas
              readOnly: true
            - name: data
              mountPath: /data
            - name: models
              mountPath: /models
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "atlas.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-data
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "atlas.fullname" . }}-models
