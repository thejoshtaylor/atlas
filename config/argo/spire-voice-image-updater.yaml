# argocd-image-updater v1 reads ImageUpdater resources, not Application
# annotations alone. Without this resource, nothing pins new :latest digests
# and a push to main builds an image that is never deployed. The
# Application's own annotations (image-list, digest strategy, image.ref)
# still hold the settings; useAnnotations tells the updater to read them.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: spire-voice
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: spire-voice
      useAnnotations: true
