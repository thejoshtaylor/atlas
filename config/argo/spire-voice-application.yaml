# Argo CD Application driving spire-voice on the jt-spire build cluster.
# Mirrors the shape of the existing chat-manager Application on this
# cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire-voice
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=harbor.tail41bc66.ts.net/spire-voice/app:latest
    argocd-image-updater.argoproj.io/app.update-strategy: digest
    argocd-image-updater.argoproj.io/app.helm.image-spec: image.ref
    argocd-image-updater.argoproj.io/app.pull-secret: pullsecret:argocd/regcred-spire-voice
spec:
  project: default
  source:
    repoURL: https://github.com/thejoshtaylor/spire-voice.git
    targetRevision: HEAD
    path: charts/spire-voice
    helm:
      valueFiles:
        - values-build.yaml
      # No `parameters` block here — argocd-image-updater writes that
      # itself on its first successful run. A hand-written one is a stale
      # digest waiting to be re-applied over whatever the updater already
      # resolved.
  destination:
    server: https://kubernetes.default.svc
    namespace: home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
