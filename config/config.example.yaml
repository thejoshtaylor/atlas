# atlas configuration.
#
# Nothing house-specific belongs in this repo. This file is the shape of the
# config, with placeholder values. The real one is mounted into the pod from a
# ConfigMap, and every credential in it comes from a Secret through an env var
# written as ${NAME} below.
#
# Env expansion happens once, at load, over the raw text. A ${NAME} with no
# value in the environment is a startup error rather than an empty string,
# because an empty RTSP password fails much later and much less clearly.
#
# Phase 3 (PROV-04, D-07): the four provider credentials this file's own
# stt.api_key/brain.api_key/tts.api_key/mcp.servers.ha.env.HA_TOKEN keys
# name are resolved in one stated order, at startup, before any provider is
# constructed: a value saved through the webapp's credentials screen (the
# database) wins when one is stored; otherwise this file's own environment
# expansion (the values below) wins; otherwise the slot is unset. An
# existing ${NAME}-only deployment keeps working through this change --
# the environment remains a real, read-only fallback source, not something
# this phase deprecates. A credential entered in the webapp needs a
# restart to take effect: the providers these values feed are constructed
# once, here, in lifespan, and nothing rebuilds them on a later database
# write (unlike the safety policy, where the same write respawns the
# enforcing child). See atlas/crypto/credentials.py for the one
# function that makes this decision.
#
# Phase 3 (D-01, D-03): the always-listening audio source below (camera:)
# is joined by the same database-then-config precedence, through the
# wizard's own settings table -- an operator who chooses a source in the
# first-run wizard has that choice stored, and the stored value wins the
# same way a saved credential does; this file's own shipped default
# ("camera", the only source this phase builds) wins otherwise. Like a
# credential, a changed audio source needs a restart to take effect: the
# source is built once, here, in lifespan, and nothing rebuilds it on a
# later database write. See atlas/routes/wizard.py's
# resolve_audio_source for the one function that makes this decision.

server:
  # Phase 1 has no accounts and no login (WEB-04 adds those in Phase 3), so
  # anything that can reach this port can switch real power. Binding to
  # loopback means only this host can reach it; binding wider is a knowing
  # operator decision, not a default.
  #
  # Phase 7 (D-15): one config file serves the dev harness and both
  # deployment targets, through this same ${VAR}. The dev harness's own
  # .env.example ships "127.0.0.1" here, unchanged from before this
  # placeholder existed. A container deployment ships "0.0.0.0" instead --
  # a bind address a host process can reach directly is not the same
  # thing a container's own port-forwarding needs, and Docker cannot
  # forward a published port to a process bound only to the container's
  # own loopback interface. Quoted, because expansion happens over raw
  # text before the YAML parse, and this value must stay a string.
  bind_host: "${BIND_HOST}"
  port: 8080

  # websocket | webrtc -- the D-01 selector. The operator picks one; Phase 3's
  # admin surface exposes this same key once the webapp exists to hold it.
  transport: websocket

  # Phase 4 (D-01, CMD-03): the zone the assistant reads the current time
  # and date from when answering a spoken time or date question. Unset (the
  # default, and what this example ships) means the process's own local
  # zone -- resolved at startup and logged by name, never guessed silently.
  # Set to an IANA zoneinfo name (e.g. "America/Los_Angeles") to pin one
  # explicitly regardless of the container's own zone; an unrecognized name
  # stops startup, naming this key.
  # timezone: "America/Los_Angeles"

database:
  # Phase 3 (D-01): the database is authoritative for everything an operator
  # edits -- the safety policy, provider credentials, accounts and invites.
  # This section is the bootstrap seam: where the database is, before any of
  # that can be read. The runtime, asynchronous connection string --
  # postgresql+asyncpg://... -- built once in app.py's lifespan and reused
  # for the life of the process, never per-request (D-02).
  url: "${DATABASE_URL}"

  # Alembic's own connection is derived from url above by driver swap
  # (+asyncpg -> +psycopg), so the two strings cannot drift apart across a
  # deployment. Uncomment and set only if migrations must run through a
  # different user or host than the runtime connection uses.
  # migration_url: "postgresql+psycopg://..."

  # Run pending migrations at every startup, before the application serves
  # a single request (D-02, DEP-04: "an upgrade keeps existing data"). This
  # is the same "refusal beats starting half-configured" instinct app.py's
  # calibration gate already applies, extended to the schema itself.
  run_migrations_at_startup: true

# safety: -- retired (D-11). This file shipped no safety: block before this
# comment existed, so there is nothing here to delete; this note exists for
# an operator whose own, separately-held configuration file still has one.
# The policy now lives in the database, seeded once by the first migration
# (alembic/versions/0001_policy_tables.py) from whatever safety: block that
# file held at the time. Edit the denylist and allowlist in the webapp's
# policy editor from then on -- a safety: key still present here is a
# startup error naming the key (Config.from_config), the same way brain.model
# and gate.require_face already are for the keys retired before it.

security:
  # Phase 3 (D-05): an HttpOnly, SameSite=Lax cookie holding a short-lived
  # JWT, plus a longer-lived opaque refresh token stored server-side in
  # Postgres. The signing/encryption key itself is never written here --
  # it comes from the environment (ATLAS_SECRET_KEY below), read only at
  # the point of use, and a missing key is a startup error naming the
  # variable, never a silently generated one (PROV-04).
  secret_key_env: "ATLAS_SECRET_KEY"

  # 15 minutes. Live: a stolen access token this short-lived limits its own
  # blast radius without forcing a re-login every few minutes.
  access_token_ttl_s: 900

  # 14 days. Needs a restart of the session (a fresh login) once it expires;
  # rotated on each use in between.
  refresh_token_ttl_s: 1209600

  cookie_name: "atlas_session"

  # true in any deployment reachable from more than this one host, over
  # HTTPS. false here because the example config targets a plain-HTTP dev
  # harness (Phase 1's own posture); a stranger who terminates TLS in
  # front of a real deployment sets this true alongside it.
  #
  # Phase 7 (D-15): read from ${VAR}, the same mechanism bind_host uses
  # above. The shipped Docker Compose deployment (docker-compose.yml)
  # keeps this false even though it also sets bind_host to 0.0.0.0 -- the
  # published port is bound to the host's own loopback address there, so
  # the cookie never crosses a real network out of the box, and false
  # stays an honest default rather than a forgotten one. Unquoted: raw
  # text substitution runs before the YAML parse, and an unquoted true/
  # false becomes a real YAML boolean, not the string "true"/"false".
  cookie_secure: ${COOKIE_SECURE}

camera:
  # The audio source. Read straight from the camera over RTSP rather than from
  # go2rtc: go2rtc republishes video fine, but consuming the microphone from its
  # tapo:// producer hangs with no error on this setup, and a second direct RTSP
  # connection alongside Frigate is measured-good.
  #
  # 260922-cmo (D-1, T-CMO-02): the whole authenticated URL, not the host
  # and credentials interpolated separately -- this repository is public,
  # and a real camera IP or hostname belongs only on the hand-applied
  # Secret this deployment reads from, never in this committed file.
  rtsp_url: "${CAMERA_RTSP_URL}"

  # The Tapo C121 emits G.711 A-law, 8 kHz, mono. xAI's STT accepts exactly
  # that, so audio is never transcoded anywhere in this pipeline. If you point
  # this at a camera that emits something else, set it here and the pipeline
  # will transcode -- and get slower.
  encoding: alaw
  sample_rate: 8000
  channels: 1

  # How much audio to keep before the wake word fires. The wake detector
  # reports a hit about 0.2-0.3 s after the phrase ends (260923-spd, measured
  # against six live camera turns), and a speaker usually runs straight from
  # "hey atlas" into the command with no pause, so the first syllables of the
  # command are already in the past by the time we know to listen. Replaying
  # this buffer into the transcriber recovers them. 300 ms covers that
  # detector lag with room to spare; audio that keeps arriving while STT
  # connects is queued by the source, not lost, so there is no need to hold
  # more than the lag itself -- a bigger window only replays more of the wake
  # word itself back into STT. The wake-only continuation (260922-woc) stays
  # as the safety net for a transcript that turns out to be wake-word-only.
  preroll_ms: 300

speaker:
  # go2rtc | tapo_talk | tcp
  #
  # go2rtc: the long-lived ffmpeg egress below, pushed into go2rtc's own
  # tapo:// producer for the camera's speaker -- the same path the gesture
  # beeps use.
  #
  # tapo_talk: some firmware's 8800 media session now demands a SHA256 /
  # encrypt_type=3 digest go2rtc's built-in tapo:// client cannot satisfy,
  # so every backchannel push through it returns 401. This backend drives
  # the camera speaker directly through pytapo's authenticated 8800 session
  # instead. It reads the Tapo cloud-account password from
  # TAPO_CLOUD_PASSWORD in the process environment (not a ${VAR} in this
  # file -- read at point of use, never stored on Config), derives the
  # camera host from camera.rtsp_url above, and connects as admin@host:8800.
  #
  # tcp (260923-pds, reply format 260923-pyj): the same long-lived ffmpeg
  # egress as go2rtc above, but it pushes the reply audio over plain TCP to
  # tcp_url below, to a listener on another machine (for example a
  # Raspberry Pi) that plays it. The stream is NUT, and its header carries
  # the codec and the sample rate (tts.codec and tts.sample_rate, further
  # down this file), so the listener needs no format flags of its own. Set
  # TTS_CODEC=pcm and TTS_SAMPLE_RATE=24000 for better sound than the
  # camera's narrowband A-law. go2rtc_url, stream, and ensure_url are not
  # used on this path. respawn_backoff_s also sets the wait before the pod
  # reconnects to a listener that went away. Example listener command, on
  # the Pi:
  #   ffmpeg -f nut -listen 1 -i tcp://0.0.0.0:5701 -f pulse default
  # Do not add -fflags nobuffer to that listener -- it drops the first
  # packet of every connection (measured at planning time).
  #
  # Default stays go2rtc so an existing deployment's behaviour is never
  # silently changed by this key's addition.
  #
  # 260922-cmo (D-1): read from the environment rather than committed as a
  # literal -- an expanded value still passes SpeakerConfig.from_config's
  # {go2rtc, tapo_talk, tcp} allowlist below, since env expansion runs over
  # raw text before that validation ever sees this field.
  backend: "${SPEAKER_BACKEND}"

  # Only read when backend is tcp: the tcp://host:port of the listener that
  # plays reply audio. The address belongs in the environment, not in this
  # file -- the empty default here means a deployment on another backend
  # needs no value. A tcp backend with an empty or non-tcp:// value stops
  # startup with a ConfigError naming speaker.tcp_url.
  tcp_url: "${SPEAKER_TCP_URL:-}"

  # go2rtc, running inside the Frigate pod. It already holds a tapo:// producer
  # for the camera's speaker -- the same path the gesture beeps use.
  go2rtc_url: "http://frigate:1984"
  stream: "cam"

  # Idempotent PUT that (re)creates the backchannel producer. Holds the camera
  # password, so it arrives as a whole URL from a Secret rather than being
  # assembled here.
  ensure_url: "${SPEAKER_ENSURE_URL}"

  # A fresh ffmpeg process per utterance costs 300-800ms before the first sample
  # reaches the speaker, which is the single largest avoidable delay in the
  # round trip. Instead one long-lived ffmpeg reads this FIFO and stays
  # connected to go2rtc; speaking is then just a write() into the pipe.
  #
  # 260922-cmo: under /data, not /run/atlas -- nothing creates /run/atlas
  # and it is not a mounted volume on either deployment target, so
  # fifo_writer.py's own os.mkfifo() (which does not create parent
  # directories) always failed against this shipped default. /data is the
  # one writable volume both the Helm chart (a PVC) and Compose (a named
  # volume) already mount.
  fifo_path: "/data/speaker.fifo"
  # 260922-gde: the camera's talk port (8800) locks out every client after
  # a run of failed auths. A short backoff re-armed that lockout on every
  # retry, so a dead speaker session never recovered while the pod kept
  # running; 30s gives the lockout time to clear between attempts.
  respawn_backoff_s: 30.0

  # Opening this FIFO blocks at the OS level until a reader attaches. The
  # first open, at startup, waits as long as it takes -- there is nothing
  # yet to time out against. A later reopen, after the ffmpeg child above
  # loses its reader and respawn_backoff_s is already retrying it, is
  # different: this bounds that wait, so a respawn that stalls or fails
  # turns into a raised, logged error instead of a permanently silent
  # assistant. This is independent of respawn_backoff_s -- it bounds how
  # long one write waits for a reader before it fails loudly, not how many
  # respawn cycles fit inside it.
  reopen_timeout_s: 10.0

  # ffmpeg reads this FIFO in fixed packets of up to 0.1 s and holds a
  # partial last packet. Without padding, the end of a reply waits for the
  # next reply to push it out.
  #
  # After tail_pad_idle_s with no new audio, the writer adds tail_pad_s of
  # silence once. 0 turns padding off.
  #
  # A gap in the middle of a reply that is longer than tail_pad_idle_s also
  # gets the silence. Raise tail_pad_idle_s if you hear short pauses inside
  # replies.
  tail_pad_s: 0.2
  tail_pad_idle_s: 0.15

wake:
  # openwakeword | vosk
  #
  # wake-default-evidence: provisional
  #
  # The line above is the one machine-readable statement of whether this
  # default came from a score. A test (tests/test_score_wake_engines.py)
  # fails the whole suite if DBG-04 is marked complete in
  # .planning/REQUIREMENTS.md while this line still says provisional, and
  # fails it the other way too if this line ever says measured while
  # DBG-04 stays unmarked -- see docs/runbooks/wake-engine-corpus.md for
  # the recording session and the scoring run that change it, together.
  #
  # Vosk ships live today. This is PROVISIONAL, not measured (D-08): plan
  # 02-09 built scripts/capture_wake_corpus.py and scripts/score_wake_engines.py,
  # the harness that scores both engines offline against identical recorded
  # audio -- but no corpus exists in this environment (no camera, no
  # /models, no Vosk model directory), so the harness has never actually
  # run against a real recording. It is tested against synthetic scores,
  # not audio; the live recording-and-scoring run is tracked as
  # live-verification debt, and DBG-04 stays unticked until it happens.
  #
  # Separately, and regardless of any corpus: no "hey atlas" model exists
  # for openwakeword, and producing one is an offline training pipeline
  # (synthetic TTS positives plus real recordings, run through
  # openWakeWord's own notebooks) outside this codebase's scope --
  # scripts/score_wake_engines.py reports it as unavailable with the
  # missing path named, never as a silent absence. Vosk needs no such
  # model -- it descends from Kaldi telephony work, which already suits
  # this camera's 8 kHz narrowband, and restricting its decoder to a
  # one-phrase grammar makes a false fire hard. That is the only evidence
  # behind this default until the harness actually runs against a
  # recording: an argument, not a score. Both engines still ship as code
  # below -- openwakeword remains a live option once its model exists.
  engine: vosk
  phrase: "hey atlas"

  openwakeword:
    model_path: "/models/hey_atlas.onnx"
    threshold: 0.55
    # Frames are 80ms at 16 kHz. The camera is 8 kHz, so audio is upsampled for
    # the detector only; the copy sent to the transcriber stays untouched 8 kHz.
    trigger_frames: 2

  vosk:
    model_path: "/models/vosk-model-small-en-us-0.15"
    # Restricting the decoder to the phrase plus [unk] means anything that is
    # not the phrase decodes as [unk] and is discarded.
    grammar: ["hey atlas", "[unk]"]

  # After a hit, ignore further hits for this long. Without it a drawn-out
  # "heyyy atlas" fires two sessions and the second one transcribes silence.
  refractory_s: 2.0

  # Play a short chime on a wake-word hit, so the speaker knows when to start
  # the command. Only a source with a speaker (the camera) plays it.
  cue: true

gate:
  # Voice is an ambient trigger: the camera microphone hears the television, and
  # a television can say any sentence in the language. This gate decides when
  # the wake word is even allowed to count.
  #
  # Identity gating (Frigate face recognition, the way the gesture pod uses it)
  # was considered and removed: PROJECT.md's Out of Scope says the operator
  # chose to let anyone in earshot command the house. The denylist in
  # mcp/atlas_mcp/safety.py is what protects it, not who is standing in the
  # room -- setting require_face, face_names, or face_window_s here is a
  # startup error naming the key, not a silent no-op.

  # Do not listen while these entities are playing. The most common false
  # trigger source is your own television, and a television can say any
  # sentence in the language -- but only the operator knows which of the
  # house's media players that actually is. This ships empty on purpose and
  # is never pre-populated with a guess: a wrong guess silently disables the
  # one gate that exists for an ambient trigger.
  mute_when_playing: []

  # Per-source override (D-04): a source inherits the policy above unless
  # named here. The browser microphone is a development source behind an
  # authenticated admin page with no television in the loop, so it runs with
  # no suppression list -- stated explicitly rather than left as a hardcoded
  # special case, so a second camera or a second browser client inherits
  # sane behavior with no code change.
  sources:
    browser:
      mute_when_playing: []

barge_in:
  # A floor-plus-guard-window gate, with an optional known-output
  # correlation layered on top (plan 02-12, Tier 2). The base gate fires on
  # sustained energy above a floor, past a guard window after playback
  # starts -- not a single frame, and explicitly not requiring the wake
  # word again (D-10). The correlation, below, is what compares that
  # energy against what this process actually wrote to the speaker FIFO --
  # the code review (CR-02) found this absent entirely; it now exists,
  # unit-tested, and inert until a real calibration turns it on.
  enabled: true

  # Same unit as stt.vad_threshold below (0.08), the only noise-floor
  # measurement this camera has today -- no conversion happens anywhere on
  # this path, so a configured floor means one thing only. PROVISIONAL until
  # real camera sessions exist to tune it directly (CD-3).
  energy_floor: 0.08

  # Sustained, not a single frame: long enough that a cough or a door does
  # not read as an interrupt, short enough that a real interruption still
  # feels immediate.
  min_duration_ms: 300

  # Ignore energy for this long after playback starts. The FIFO write and the
  # speaker's own acoustic path both carry some latency, and without this
  # guard the tail of the assistant's own first syllable can read as an
  # interruption of itself.
  post_playback_guard_ms: 150

  # Off by default everywhere. Two steps turn it on for a source: run
  # calibration.dir's echo-path measurement against the real camera
  # (scripts/dev-calibrate-echo.sh), then set this AND the source's own
  # barge_in.sources.<name>.enabled to true. app.py's startup refuses to
  # boot if this is true with no valid, non-stale calibration on file --
  # it will not silently fall back to the floor-and-guard-window gate
  # above. Even once on, this cannot separate a voice speaking at the
  # exact moment the assistant is from the assistant's own echo -- that
  # case stays open, and full acoustic echo cancellation is the only thing
  # that would close it (CONTEXT.md's Deferred section).
  correlation_enabled: false

  # Headroom, in the same unit as energy_floor, that observed energy may
  # exceed the predicted echo by and still count as explained --
  # measurement noise, not a second floor. PROVISIONAL, same posture as
  # energy_floor above.
  correlation_tolerance: 0.03

  # Only used once correlation is on for a camera whose calibration found
  # automatic gain control present or indeterminate: the exponential-
  # moving-average weight given to each explained reading when updating the
  # running gain estimate. Fast enough to follow the AGC creep the
  # calibration probe is built to detect; slow enough that a real
  # interruption's own few readings cannot swing it first.
  tracking_adaptation_rate: 0.1

  # Per-source override (D-12), same shape as gate.sources above. The
  # camera overrides the global default to off: its microphone and speaker
  # are the same device with no AEC, so this gate's floor-and-guard-window
  # mechanism alone cannot reliably tell the assistant's own voice apart
  # from a real interruption. Flip this to true only after a real
  # calibration exists and correlation_enabled above is also true -- see
  # the comment on correlation_enabled for the two steps.
  sources:
    camera:
      enabled: false

stt:
  url: "wss://api.x.ai/v1/stt"
  api_key: "${XAI_API_KEY}"

  # Silence before the utterance is declared finished. The xAI default is 400ms;
  # it is the largest tunable term in the response time and 200ms is comfortable
  # for command-shaped speech. Raise it if the tail of your sentences is getting
  # cut off.
  endpointing_ms: 200

  # Lets the model predict end-of-turn rather than waiting out a fixed silence.
  # smart_turn_timeout is the safety net for when it never becomes confident.
  smart_turn: 0.7
  smart_turn_timeout_ms: 1200

  # Default is 0.08. Raising it rejects more room noise at the cost of rejecting
  # quiet speech; this microphone is across a room, so be careful going up.
  vad_threshold: 0.08

  interim_results: true
  language: "en"

  # Words to bias recognition toward, comma-separated: the wake word and the
  # device names and phrases this house actually says. Replaying recorded
  # camera turns, this took a noisy narrowband command from about 5 of 13
  # to 12 of 13 transcribed right. List only names you say out loud: a
  # listed name also pulls unclear background speech toward itself. At most
  # 100 terms, 50 characters each. House names belong in STT_KEYTERMS, not
  # in this file.
  keyterms: "${STT_KEYTERMS:-Atlas}"

  # Give up on a session that produces nothing, so a stuck socket cannot hold
  # the pipeline open forever.
  max_utterance_s: 15

  # The local speech-to-text option (D-09, D-11): faster-whisper, selected in
  # the /providers screen rather than here -- these three keys only take
  # effect when that option is chosen. local_model_dir must already hold a
  # provisioned faster-whisper model (see docs/runbooks for the fetch step);
  # nothing in this process ever downloads one at boot, so a missing
  # directory degrades this slot with the path named, rather than fetching
  # one. local_model_size documents which size was provisioned there
  # (display/logging only -- the directory above is what actually loads).
  # local_compute_type must be one this CPU-only host's ctranslate2 backend
  # actually supports: int8, int8_float32, or float32.
  local_model_dir: "/models/faster-whisper"
  local_model_size: "small"
  local_compute_type: "int8"

brain:
  base_url: "https://api.x.ai/v1"
  api_key: "${XAI_API_KEY}"

  # D-01: an ordered tier list, fastest first, most capable last -- replaces
  # the old single `model` key, which no longer exists (a config file still
  # carrying it stops startup by name). All tiers race concurrently on every
  # turn; the first confident answer wins and the rest are cancelled. The
  # last entry is the only one that reaches Home Assistant -- position, not a
  # per-entry flag, decides this (D-05), so no configuration can produce two
  # tool-calling tiers. This is the same key Phase 3's admin surface exposes
  # (D-02), same precedent as the transport selector above.
  #
  # One fast non-reasoning model, not three, is the default (260923-spd):
  # six live camera turns measured about 5 s from wake to final transcript
  # before the brain even started, and the two slower reasoning tiers below
  # it added enough of their own latency that 2 of 6 turns hit
  # `turn_timeout_s` (25 s) waiting on them. A single reply the operator
  # gets in about 1.2 s beats a race that sometimes never finishes. More
  # tiers remain possible -- add entries back below the fast one if a future
  # measurement justifies the wait:
  #   grok-4.20-0309-non-reasoning: 1,212 ms
  #   grok-4.3:                     3,106 ms
  #   grok-4.6:                     7,401 ms
  models:
    - model: "grok-4.20-0309-non-reasoning"

  # D-08: how long to wait, after the final transcript, before playing the
  # filler if no answer audio is ready yet. Provisional -- plan 01.1-08
  # measures the real number. 0 disables the filler entirely.
  filler_after_ms: 600

  # The entity list is injected into the system prompt at startup so the model
  # never needs a discovery round trip to learn what exists. It is large and
  # unchanging, which is exactly what prompt caching is for.
  #
  # 260924-4iv (item c): xAI caches a repeated prompt prefix by itself, per
  # server. true sends one x-grok-conv-id header, generated once per
  # process, on every brain request -- tier calls and the shared envelope
  # call alike -- so every turn this process runs reaches the same server
  # and keeps hitting that server's own cache of the (large, unchanging)
  # entity catalog. false sends no such header.
  cache_system_prompt: true

  temperature: 0.0
  max_tokens: 400

  # A command that needs more than this many tool calls is a misunderstanding,
  # not a complex request. Stop and say so. Back to 3: two rounds allow only
  # one tool step before the reply, so a turn that must
  # read a sensor, then call a service
  # hits the old cap of two. turn_timeout_s below still limits the worst case.
  max_tool_rounds: 3

  # 260922-woc: a ceiling on the whole tier race, seconds. A live turn once
  # spent about 55s in tool rounds and returned an empty answer with nothing
  # having bounded the wait -- past this many seconds, the race is cancelled
  # and a fixed "i can't do that one" is spoken instead of silence.
  turn_timeout_s: 25.0

  # 260924-4iv (item a): the one deadline, past the final transcript, a
  # turn may spend waiting on the prefetched live-state read and the
  # prefetched pending-runs read together. A read that misses this bound
  # is cancelled and the brain is told state is not available this turn,
  # rather than left waiting indefinitely or shown an empty list that
  # could be misread as "nothing is on". 0 means "use the state only if
  # it is already there".
  state_timeout_ms: 500

  # 260924-4iv (item b): the per-turn state message lists only entities
  # whose domain is in this list -- narrower than the full house, since
  # most houses have far more sensors than controllable devices. ["*"]
  # lists every domain (the pre-4iv behavior). Every entity stays in the
  # cached catalog and reachable by a get-state tool call regardless of
  # this filter -- nothing here hides an entity from the model's
  # knowledge that it exists.
  state_domains:
    - alarm_control_panel
    - climate
    - cover
    - fan
    - humidifier
    - input_boolean
    - input_number
    - input_select
    - light
    - lock
    - media_player
    - scene
    - script
    - siren
    - switch
    - vacuum
    - valve
    - water_heater

  # 260922-lim: a plain on/off command ("turn off the lamp") is matched
  # against live entity state locally, before the tier race ever starts --
  # no model round trip, no garbled transcript ever reaching a language
  # model at all. Set to false to send every command through the brain
  # instead.
  local_intents: true

tts:
  url: "https://api.x.ai/v1/tts"
  api_key: "${XAI_API_KEY}"
  voice_id: "eve"
  language: "en"

  # This is the format of the reply audio that goes into the speaker FIFO,
  # with no resampling step. go2rtc and tapo_talk drive the camera speaker,
  # which plays only 8 kHz A-law -- startup stops with a ConfigError if
  # these values are anything else on those two backends. On speaker.backend
  # tcp, pcm at 24000 sounds much better than the camera's narrowband A-law.
  # Both values come from TTS_CODEC and TTS_SAMPLE_RATE (260923-pyj); the
  # defaults are the camera pair, so an existing deployment needs no new
  # value.
  codec: "${TTS_CODEC:-alaw}"
  sample_rate: "${TTS_SAMPLE_RATE:-8000}"

  # The speaker codec above defaults to A-law at 8 kHz, and a browser cannot
  # decode that through the Web Audio API at all -- it plays as noise, not
  # silence-then-error, which looks like a working-but-garbled pipeline in
  # manual testing. The browser dev harness (Phase 1) requests raw PCM at
  # this rate instead; the camera path (Phase 2) keeps using codec/sample_rate
  # above, unchanged.
  browser_codec: pcm
  browser_sample_rate: 24000

  # 0 | 1 | 2, higher trades a little quality for first-audio latency.
  optimize_streaming_latency: 2

  # Short confirmations are the same handful of sentences forever. Rendering
  # them once to disk removes the whole TTS round trip from the common path.
  # The startup precache also synthesizes every holding phrase (the closed
  # filler-phrase set) and every macro's reply automatically, so the list
  # below is the operator's own additions, not the whole set that gets
  # rendered.
  cache_dir: "/data/tts-cache"
  precache:
    - "ok"
    - "done"
    - "sorry, i didn't catch that"
    - "i can't do that one"
    - "cancelled, nothing was changed"
    - "done, it's on your calendar"
    - "done, it's deleted"

  # The local text-to-speech option (D-09, D-10): Piper, selected in the
  # /providers screen rather than here -- these two keys only take effect
  # when that option is chosen. Both must already be provisioned (see
  # docs/runbooks for the fetch step); nothing in this process ever
  # downloads either at boot, so a missing file degrades this slot with
  # the path named. Piper is an optional extra (`pip install
  # 'atlas[piper]'`) and its inference code is GPL-3.0-or-later, not
  # the MIT licence most of this project uses -- see the README before
  # redistributing a build that includes it.
  piper_voice_path: "/models/piper/en_US-lessac-medium.onnx"
  piper_config_path: "/models/piper/en_US-lessac-medium.onnx.json"

# D-06, D-09: after a calendar readback, the microphone stays open briefly
# with no wake word so the operator can answer "yes" without saying the
# wake word again. The window opens only after the readback's own audio
# has finished playing, plus an echo tail, so the assistant can never hear
# its own readback as the answer -- the camera has no echo cancellation.
follow_up:
  # How long the window stays open once it opens, in seconds (3 to 15).
  window_s: 6.0
  # Added on top of the readback's own estimated playback end before the
  # window opens, in milliseconds (0 to 5000) -- the larger of this value
  # and a real echo-path calibration's own measured delay plus a fixed
  # margin is what `sources/runner.py` actually uses when a calibration
  # exists.
  echo_tail_ms: 800

# macros: -- retired (D-09). This file shipped a macros: block before this
# comment existed, so an operator upgrading from before Phase 4 still has
# one in their own, separately-held configuration file. Macros now live in
# the database, seeded once by the migration
# (alembic/versions/0005_macro_tables.py) from whatever macros: block that
# file held at the time. Edit macros in the webapp's macro editor from then
# on -- a macros: key still present here is a startup error naming the key
# (Config.from_config), the same way safety: already is (D-11) and
# brain.model and gate.require_face were before it.

# mcp: -- retired (D-01, plan 06-01). This file shipped an mcp: block
# before this comment existed, so an operator upgrading from before Phase 6
# still has one in their own, separately-held configuration file. Every MCP
# server -- Home Assistant and weather included -- is a plugin now, seeded
# once by the migration (alembic/versions/0008_plugin_tables.py) from
# whatever mcp: block that file held at the time (HA_TOKEN encrypted at
# rest). Install, enable, disable, and configure plugins in the webapp's
# plugins screen from then on -- an mcp: key still present here is a
# startup error naming the key (Config.from_config), the same way safety:
# and macros: already are (D-11, D-09).

plugins:
  # D-07: every enabled plugin -- Home Assistant included, no exception --
  # starts concurrently, behind this one deadline. A plugin whose start has
  # not finished when this many seconds pass is marked degraded and logged
  # by name; the assistant boots anyway with that plugin's tools absent.
  # Raise this on a slower host (a Raspberry Pi, or one already busy
  # running a local model alongside these children) where a stdio child's
  # own process spawn and MCP handshake legitimately take longer.
  startup_deadline_s: 10

  # D-05: once a plugin's own ping watchdog notices its child has died, the
  # supervisor respawns it on exponential backoff between these two
  # bounds -- the first retry waits respawn_backoff_min_s, and each further
  # failed attempt doubles the wait up to respawn_backoff_max_s, so a
  # plugin stuck in a crash loop never busy-loops restarting it.
  respawn_backoff_min_s: 1
  respawn_backoff_max_s: 30

debug:
  # One directory per interaction, holding the audio, every event with an
  # arrival timestamp, and a merged timeline. This is the raw material for
  # tuning thresholds later, so it is on by default and verbose on purpose.
  # Only the pre-roll a wake hit actually replays is recorded here -- there
  # is no continuous rolling capture (D-15).
  dir: "/data/sessions"
  record_audio: true

  # Seven days: a conservative floor on how long audio of a real home stays
  # on disk. This is not a cache size -- the operator raises it deliberately,
  # never lowers it for convenience (D-14). The retention sweep below is what
  # enforces it, and it logs what it removed.
  retain_days: 7

  # How often the retention sweep runs, in seconds. Well under a day so a
  # long-running process sweeps expired sessions more than once between
  # restarts.
  expiry_interval_s: 3600

  # Also emit a one-line summary per interaction to stdout for kubectl logs.
  stdout_summary: true

calibration:
  # Echo-path calibration (Tier 1, VOICE-07): plays a known probe out of the
  # camera speaker, records it back from the camera microphone, and measures
  # the round-trip delay, the echo level, the gain, and whether the camera
  # applies automatic gain control. Run it with scripts/dev-calibrate-echo.sh
  # today; Phase 3's admin wizard drives the same run_echo_calibration
  # through the routes below once it exists (D-20).
  dir: "/data/calibration"

  # How long the probe itself plays. Below audio/probe.py's own
  # MIN_DURATION_S (1.0s) is a startup error -- shorter gives the correlator
  # too few independent samples to resolve a single delay from.
  probe_duration_s: 2.0

  # Silence held before the probe is written, so a real microphone has time
  # to settle past whatever was mid-flight when it opened.
  settle_s: 0.5

  # Recorded past the probe's own duration, so a round-trip delay near the
  # top of the plausible range is still inside the recorded window.
  tail_s: 0.5

  # Past this many days, a stored calibration is treated as stale and
  # Phase 3's wizard offers a re-run rather than silently trusting an old
  # measurement -- software cannot detect that somebody moved the camera.
  max_age_days: 30

  # The HTTP route that runs a live calibration makes a real home play a
  # sound and records the room. Off by default: Phase 2 has no account
  # system, no roles, and no session to put in front of it. Turning this on
  # is a deliberate operator choice until WEB-01/WEB-04 (Phase 3) ship
  # authentication in front of it.
  #
  # 260922-fmi (D-15): read from ${VAR}, the same mechanism cookie_secure
  # uses above. The public default is false; the operator sets this true
  # only in the cluster's hand-applied Secret (D-2), never in this file.
  route_enabled: ${CALIBRATION_ROUTE_ENABLED}

workflow:
  # Scheduled workflows (FLOW-01 through FLOW-10, SAFE-08): a spoken or
  # webapp-authored plan of ordered steps (wait, call_service, speak), each
  # claimed off the database when its own due_at comes due. There is no
  # workflows: block here for a migration to seed from -- runs and steps
  # live only in the database (workflow_runs/workflow_steps,
  # alembic/versions/0006_workflow_tables.py), never in this file.
  #
  # A step that came due while the process was down runs on the next poll
  # after restart, late, and says so -- it is never silently dropped
  # (D-04). This is what makes poll_interval_s a responsiveness knob, not a
  # correctness one.
  poll_interval_s: 5

  # Bounds one poll tick's drain, so a large backlog of due steps cannot
  # starve the loop -- the poller claims at most this many steps before
  # sleeping again, even if more are due.
  max_steps_per_poll: 20

  # Past this many seconds of lateness, a fired step's spoken/recorded
  # outcome says how late it ran, rather than staying silent about it.
  late_threshold_s: 60

  # A step that fails for a transient reason retries up to this many times
  # before its run is left in a terminal failed state -- never forever.
  max_attempts: 3

  # How far a retried step's due_at is pushed out each attempt.
  retry_backoff_s: 30

  # A step claimed but not yet resolved for longer than this is treated as
  # orphaned by a crash (a process killed between a call_service step's real
  # Home Assistant call and the write recording it, CR-01) rather than
  # merely still running, and is reclaimed on the next poll -- for
  # call_service, into a failed step whose outcome is honestly recorded as
  # unknown, never retried; for wait/speak, safely re-run. Keep this well
  # above the slowest realistic call_service round trip so a genuinely
  # still-running step is never reclaimed out from under itself.
  claim_recovery_after_s: 180
