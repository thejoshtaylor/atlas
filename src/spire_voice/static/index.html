<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>spire-voice dev harness</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; line-height: 1.5; }
    #partial { color: #888; }
    button { font-size: 1rem; padding: 0.5rem 1rem; }
    #timingHistory { font-variant-numeric: tabular-nums; color: #555; }
    .timing-entry { border-top: 1px solid #ddd; padding: 0.5rem 0; }
    .timing-entry .headline { color: #111; }
    .timing-entry .stage-row { font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>spire-voice</h1>
  <p>
    A dev harness for one voice turn: no camera, no wake word. Press the
    button, speak one command, and the reply plays back through this page.
  </p>
  <button id="toggle">Start listening</button>
  <p id="partial"></p>
  <p id="reply"></p>
  <h2>Stage timings</h2>
  <p>
    Newest turn first. Every number here came from the server -- this page
    computes no duration of its own.
  </p>
  <div id="timingHistory"></div>

  <script>
    const toggleButton = document.getElementById("toggle");
    const partialEl = document.getElementById("partial");
    const replyEl = document.getElementById("reply");
    const timingHistoryEl = document.getElementById("timingHistory");

    // Labels for the seven stages `spire_voice.timing.TurnTimings` records,
    // keyed by the same field names the server sends -- this page renders
    // the labels, never invents or reorders the stages themselves.
    const STAGE_LABELS = {
      turn_started_at: "turn started",
      stt_socket_open_at: "stt socket open",
      first_partial_at: "first partial",
      stt_final_at: "stt final (end of speech)",
      brain_first_token_at: "brain first token",
      tool_rounds_done_at: "tool rounds done",
      first_audio_at: "first audio",
    };
    const STAGE_ORDER = Object.keys(STAGE_LABELS);

    function formatMs(ms) {
      return ms === null || ms === undefined ? "not reached" : `${ms.toFixed(1)} ms`;
    }

    // Renders one turn's timing event -- every number in `msg` was computed
    // on the server (`TurnTimings.stage_durations_ms()`); this function only
    // formats and appends, per D-17's "the browser renders numbers it was
    // given" contract. Previous turns are kept, newest first, so the
    // operator reads a range across several turns rather than one sample.
    function renderTimingTurn(msg) {
      const rows = STAGE_ORDER.map(
        (stage) => `<div class="stage-row">${STAGE_LABELS[stage]}: ${formatMs(msg.stage_durations_ms[stage])}</div>`
      ).join("");
      const entry = document.createElement("div");
      entry.className = "timing-entry";
      entry.innerHTML =
        `<div class="headline">end of speech to first audio: ${formatMs(msg.end_of_speech_to_first_audio_ms)}` +
        ` (${msg.turn_outcome})</div>${rows}`;
      timingHistoryEl.prepend(entry);
    }

    let listening = false;
    let activeTransport = null; // { close() } from whichever path is running
    let configuredTransport = "websocket";

    // Multi-buffer scheduling against AudioContext.currentTime -- an
    // AudioBufferSourceNode can't be appended to once assigned, so gapless
    // playback means scheduling each new chunk right after the last one ends.
    // Shared by both transports: neither gets its own copy of this class.
    class GaplessPlayer {
      constructor(ctx, sampleRate) {
        this.ctx = ctx;
        this.sampleRate = sampleRate;
        this.nextStartTime = 0;
      }

      playChunk(int16Array) {
        const float32 = Float32Array.from(int16Array, (s) => (s < 0 ? s / 32768 : s / 32767));
        const buffer = this.ctx.createBuffer(1, float32.length, this.sampleRate);
        buffer.copyToChannel(float32, 0);
        const src = this.ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(this.ctx.destination);
        const startAt = Math.max(this.ctx.currentTime, this.nextStartTime);
        src.start(startAt);
        this.nextStartTime = startAt + buffer.duration;
      }
    }

    // The one renderer for the partial transcript, the reply text, and the
    // gapless playback scheduler -- both transports' message channels
    // (a WebSocket text/binary frame, or a WebRTC data-channel message)
    // call this same function, so neither renders its own copy.
    window.player = null;
    function handleTransportMessage(event) {
      if (typeof event.data === "string") {
        const msg = JSON.parse(event.data);
        if (msg.type === "transcript.partial") {
          partialEl.textContent = msg.text;
        } else if (msg.type === "reply.text") {
          replyEl.textContent = msg.text;
          partialEl.textContent = "";
        } else if (msg.type === "turn.timing") {
          renderTimingTurn(msg);
        }
        return;
      }
      window.player.playChunk(new Int16Array(event.data));
    }
    window.handleTransportMessage = handleTransportMessage;

    async function startWebsocketListening() {
      // The browser's own hardware/OS-level echo cancellation is free here,
      // unlike the 8kHz camera in Phase 2, which has none to begin with --
      // there is no reason to disable it on this dev-harness source.
      const mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
          channelCount: 1,
          sampleRate: 16000,
        },
      });

      const audioContext = new AudioContext({ sampleRate: 16000 });
      await audioContext.audioWorklet.addModule("/static/pcm-worklet.js");
      const source = audioContext.createMediaStreamSource(mediaStream);
      const worklet = new AudioWorkletNode(audioContext, "pcm-worklet");

      // 24kHz matches tts.browser_sample_rate in config.example.yaml.
      window.player = new GaplessPlayer(audioContext, 24000);

      const scheme = window.location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${scheme}://${window.location.host}/ws/turn`);
      ws.binaryType = "arraybuffer";
      ws.onmessage = handleTransportMessage;

      await new Promise((resolve) => {
        ws.onopen = () => {
          worklet.port.onmessage = (e) => {
            if (ws.readyState === WebSocket.OPEN) {
              ws.send(e.data);
            }
          };
          source.connect(worklet);
          resolve();
        };
      });

      return {
        close: () => {
          ws.close();
          mediaStream.getTracks().forEach((track) => track.stop());
          audioContext.close();
        },
      };
    }

    async function startListening() {
      activeTransport =
        configuredTransport === "webrtc"
          ? await window.startWebrtcListening()
          : await startWebsocketListening();
      listening = true;
      toggleButton.textContent = "Stop listening";
    }

    function stopListening() {
      if (activeTransport) {
        activeTransport.close();
        activeTransport = null;
      }
      listening = false;
      toggleButton.textContent = "Start listening";
    }

    // A single on/off toggle only: end of speech is the server's decision,
    // from the speech-to-text provider's own endpointing and smart-turn
    // signals -- nothing in this page decides when speech ends, on either
    // transport.
    toggleButton.addEventListener("click", () => {
      if (listening) {
        stopListening();
      } else {
        startListening();
      }
    });

    // The page learns which transport is configured from the server rather
    // than guessing -- the toggle stays disabled until this resolves, so a
    // fast click can't race the wrong transport's start-up path.
    toggleButton.disabled = true;
    fetch("/transport")
      .then((response) => response.json())
      .then((config) => {
        configuredTransport = config.transport;
        toggleButton.disabled = false;
      });
  </script>
  <script src="/static/webrtc.js"></script>
</body>
</html>
